- name: packages
  type: object
  default:
  - packageName: DataStandardizer.Core
    variableGroupId: 20
    packageSourcePath: src/DataStandardizer.Core
    enableTests: 1
  - packageName: DataStandardizer.BCP47
    variableGroupId: 26
    packageSourcePath: src/DataStandardizer.BCP47
    enableTests: 1
  - packageName: DataStandardizer.Chronology
    variableGroupId: 64
    packageSourcePath: src/DataStandardizer.Chronology
    enableTests: 1
  - packageName: DataStandardizer.Communication
    variableGroupId: 70
    packageSourcePath: src/DataStandardizer.Communication
    enableTests: 1
  - packageName: DataStandardizer.File
    variableGroupId: 65
    packageSourcePath: src/DataStandardizer.File
    enableTests: 1
  - packageName: DataStandardizer.File.CSV
    variableGroupId: 69
    packageSourcePath: src/DataStandardizer.File.CSV
    enableTests: 1
