# Builds and tests every pull request, and publishes preview packages from develop.  The final job, DataStandardizer-CI,
# is the check the branch rulesets require.
#
# Publishing stays switched off, and runs against the SHADOW_ copy of the version variables, until the repository
# variable DS_PUBLISH_ENABLED is 'true'.  Without VERSION_STATE_CLIENT_ID nothing is published at all.

name: DataStandardizer-CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
    paths:
      - 'build/**'
      - 'images/**'
      - 'src/**'
      - 'tests/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - '*.md'
      - '*.sln'
      - '*.slnf'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force-publication:
        description: 'Packages to publish whether or not they changed (comma-separated; IDs or short names such as File.CSV; * for all)'
        type: string
        default: ''
      override-changed-packages:
        description: 'Packages to treat as changed, instead of detecting changes'
        type: string
        default: ''
      force-tagging:
        description: 'Tag published packages even when not on develop'
        type: boolean
        default: false
      dry-run:
        description: 'Push no packages and no tags'
        type: boolean
        default: false
      variable-prefix:
        description: 'Prefix of the version variables to use, such as SHADOW_ (blank for the real ones)'
        type: string
        default: ''
      verbose:
        description: 'Verbose script output'
        type: boolean
        default: false
      trace-level:
        description: 'PowerShell trace level'
        type: choice
        options: ['0', '1', '2']
        default: '0'

permissions: {}

# A newer push to a pull request supersedes its running build.  Pushes to develop are never cancelled: each may publish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Build
    # Pull requests from forks don't run on this repository's runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/build-and-publish.yml
    permissions:
      contents: write
      packages: write
    secrets: inherit
    with:
      release: false
      publish: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/develop' || inputs.force-publication != '') && vars.VERSION_STATE_CLIENT_ID != '' }}
      dry-run: ${{ inputs.dry-run == true || vars.DS_PUBLISH_ENABLED != 'true' }}
      variable-prefix: ${{ inputs.variable-prefix || (vars.DS_PUBLISH_ENABLED != 'true' && 'SHADOW_' || '') }}
      force-publication: ${{ inputs.force-publication || '' }}
      override-changed-packages: ${{ inputs.override-changed-packages || '' }}
      force-tagging: ${{ inputs.force-tagging == true }}
      verbose: ${{ inputs.verbose == true }}
      trace-level: ${{ inputs.trace-level || '0' }}

  DataStandardizer-CI:
    needs: pipeline
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check the build result
        run: |
          echo "Build result: ${{ needs.pipeline.result }}"
          test "${{ needs.pipeline.result }}" = "success"
