# Starts a patch series of a package's last release, or ends it.  Run by the maintainer just before merging a release PR
# from develop into master.
#
#   start               Saves the package's next version, then sets it to the first unreleased patch of the last release.
#                       The release build that publishes the patch reserves the following patch as the next version, so
#                       further patches in the series need no run of this workflow.
#   resume-development  After the patch series, sets the next version back to the one saved, so the next preview build
#                       numbers a preview of the development line again.
#
# The version variables are written with the version-state GitHub App, as the builds do.

name: Start patch release

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package (ID or short name, such as File.CSV)'
        type: string
        required: true
      action:
        description: 'start a patch series, or resume-development once it is finished'
        type: choice
        options: [start, resume-development]
        default: start
      variable-prefix:
        description: 'Prefix of the version variables to use, such as SHADOW_ (blank for the real ones)'
        type: string
        default: ''
      dry-run:
        description: 'Show the change without making it'
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: pwsh

env:
  GH_REPO: ${{ github.repository }}

jobs:
  patch:
    name: ${{ inputs.action }}
    runs-on: ubuntu-24.04
    environment: version-state
    concurrency:
      group: version-reservation
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # The tags show which patches have been released.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: token
        with:
          client-id: ${{ vars.VERSION_STATE_CLIENT_ID }}
          private-key: ${{ secrets.VERSION_STATE_PRIVATE_KEY }}
      - name: Set the next version
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          ACTION: ${{ inputs.action }}
          VARIABLE_PREFIX: ${{ inputs.variable-prefix }}
        run: |
          $InformationPreference = 'Continue'
          ./build/scripts/StartPatchVersion.ps1 -Package $env:PACKAGE -Action $env:ACTION -VariablePrefix $env:VARIABLE_PREFIX -WhatIf:$${{ inputs.dry-run }}
