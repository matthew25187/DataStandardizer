# Rates the repository's security practices with OpenSSF Scorecard, publishes the score for the README badge and sends
# the results to code scanning.
#
# publish_results makes the Scorecard API check this file, and it rejects the results if the check fails.  The workflow
# can't have a top-level env or defaults.  The job can't have env, defaults, a container, services or run steps, and its
# steps can only use actions on the API's allowlist.
#
# The default GITHUB_TOKEN can read the repository rulesets that Branch-Protection checks, so no secret is needed.
#
# The SARIF results go to code scanning only, as in codeql.yml.

name: Scorecard

on:
  push:
    branches: [develop]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:

permissions: {}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
