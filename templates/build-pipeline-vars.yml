    variableGroupId: 63
    packageSourcePath: src/DataStandardizer.Money
    enableTests: 1
  - packageName: DataStandardizer.UNM49
    variableGroupId: 25
    packageSourcePath: src/DataStandardizer.UNM49
    enableTests: 1

