                  scriptPath: 'build/scripts/ConfirmCurrentVersionNumber.ps1' # string. Required when scriptLocation = scriptPath. Script Path. 
                  # inlineScript: string # string. Required when scriptLocation = inlineScript. Inline Script. 
                  arguments: '-PackageName ''${{packageName}}'' -PackageInfos ''${{variables.packageInfos}}'' -TraceLevel ${{parameters.traceLevel}}' # string. Alias: scriptArguments. Script Arguments. 
                  #powerShellErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. Optional. Use when scriptType = ps || scriptType = pscore. ErrorActionPreference. Default: stop.
                env:
