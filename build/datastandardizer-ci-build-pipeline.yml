# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

name: datastandardizer_preview_$(date:yyyyMMdd)$(rev:.r)

parameters:
  - name: buildAnyCPU
    displayName: "Build AnyCPU targets"
    type: boolean
    default: true
  - name: buildX86
    displayName: "Build x86 targets"
    type: boolean
    default: true
  - name: buildX64
    displayName: "Build x64 targets"
    type: boolean
    default: true
  - name: forcePackageDataStandardizerCore
    displayName: 'Force DataStandardizer.Core package'
    type: string
    default: Build
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerBcp47
    displayName: 'Force DataStandardizer.BCP47 package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerChronology
    displayName: 'Force DataStandardizer.Chronology package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerCommunication
    displayName: 'Force DataStandardizer.Communication package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerFile
    displayName: 'Force DataStandardizer.File package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerFileCSV
    displayName: 'Force DataStandardizer.File.CSV package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerGeography
    displayName: 'Force DataStandardizer.Geography package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerIso15924
    displayName: 'Force DataStandardizer.ISO15924 package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerIso3166
    displayName: 'Force DataStandardizer.ISO3166 package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerIso4217
    displayName: 'Force DataStandardizer.ISO4217 package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerIso639
    displayName: 'Force DataStandardizer.ISO639 package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerLanguage
    displayName: 'Force DataStandardizer.Language package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerLanguageTag
    displayName: 'Force DataStandardizer.LanguageTag package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerMoney
    displayName: 'Force DataStandardizer.Money package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: forcePackageDataStandardizerUnM49
    displayName: 'Force DataStandardizer.UNM49 package'
    type: string
    default: None
    values:
    - None
    - Build
    - Publication
  - name: overrideChangedPackageNames
    displayName: 'Override changed package names'
    type: string
    default: ' '
  - name: forceTagging
    displayName: 'Force tagging'
    type: boolean
    default: false
  - name: enableDebug
    displayName: "Enable debug"
    type: boolean
    default: false
  - name: enableVerboseOutput
    displayName: "Enable verbose output"
    type: boolean
    default: false
  - name: traceLevel
    displayName: "Trace level"
    type: number
    default: 0
    values:
    - 0
    - 1
    - 2

trigger:
  branches:
    exclude:
      - master
  paths:
    exclude:
      - docs
    include:
      - build
      - images
      - src
      - tests
      - "global.json"
      - "*.md"
      - "*.sln"
      - "*.slnf"

pool:
  vmImage: ubuntu-latest

variables:
  - name: isDevelopBranch
    value: $[eq(variables['Build.SourceBranch'], 'refs/heads/develop')]
  - template: /build/build-pipeline-vars.yml
    parameters:
      packageActionDataStandardizerCore: ${{ parameters.forcePackageDataStandardizerCore }}
      packageActionDataStandardizerBcp47: ${{ parameters.forcePackageDataStandardizerBcp47 }}
      packageActionDataStandardizerChronology: ${{ parameters.forcePackageDataStandardizerChronology }}
      packageActionDataStandardizerCommunication: ${{ parameters.forcePackageDataStandardizerCommunication }}
      packageActionDataStandardizerFile: ${{ parameters.forcePackageDataStandardizerFile }}
      packageActionDataStandardizerFileCSV: ${{ parameters.forcePackageDataStandardizerFileCSV }}
      packageActionDataStandardizerGeography: ${{ parameters.forcePackageDataStandardizerGeography }}
      packageActionDataStandardizerIso15924: ${{ parameters.forcePackageDataStandardizerIso15924 }}
      packageActionDataStandardizerIso3166: ${{ parameters.forcePackageDataStandardizerIso3166 }}
      packageActionDataStandardizerIso4217: ${{ parameters.forcePackageDataStandardizerIso4217 }}
      packageActionDataStandardizerIso639: ${{ parameters.forcePackageDataStandardizerIso639 }}
      packageActionDataStandardizerLanguage: ${{ parameters.forcePackageDataStandardizerLanguage }}
      packageActionDataStandardizerLanguageTag: ${{ parameters.forcePackageDataStandardizerLanguageTag }}
      packageActionDataStandardizerMoney: ${{ parameters.forcePackageDataStandardizerMoney }}
      packageActionDataStandardizerUnM49: ${{ parameters.forcePackageDataStandardizerUnM49 }}

stages:
  - stage: Configure
    displayName: "Begin"
    jobs:
      - job: Production_packages
        displayName: 'Determine packages ready for production'
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          - task: PowerShell@2
            displayName: 'Find changed packages'
            inputs:
              #targetType: 'filePath' # 'filePath' | 'inline'. Type. Default: filePath.
              filePath: 'build/scripts/FindChangedPackages.ps1' # string. Required when targetType = filePath. Script Path. 
              arguments: '-PackageList ''${{variables.packageInfos}}'' -SourceCommitHash $(Build.SourceVersion) -TraceLevel ${{parameters.traceLevel}}' # string. Optional. Use when targetType = filePath. Arguments. 
              #script: # string. Required when targetType = inline. Script. 
            # Preference Variables
              #errorActionPreference: 'stop' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
              #warningPreference: 'default' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. WarningPreference. Default: default.
              informationPreference: 'continue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. InformationPreference. Default: default.
              verbosePreference: ${{ iif(eq(parameters.enableVerboseOutput, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. VerbosePreference. Default: default.
              debugPreference: ${{ iif(eq(parameters.enableDebug, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. DebugPreference. Default: default.
              #progressPreference: 'silentlyContinue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ProgressPreference. Default: silentlyContinue.
            # Advanced
              #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
              #showWarnings: false # boolean. Show warnings as Azure DevOps warnings. Default: false.
              #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
              pwsh: true # boolean. Use PowerShell Core. Default: false.
              #workingDirectory: # string. Working Directory. 
              #runScriptInSeparateScope: false # boolean. Run script in the separate scope. Default: false.
          - powershell: | # Required as first property. Inline PowerShell script.
              Write-Host "##vso[task.setvariable variable=changedPackageNamesList]${{trim(parameters.overrideChangedPackageNames)}}"
            # errorActionPreference: string # Unless otherwise specified, the error action preference defaults to the value stop. See the following section for more information.
            # failOnStderr: string # Fail the task if output is sent to Stderr?
            # ignoreLASTEXITCODE: string # Check the final exit code of the script to determine whether the step succeeded?
            # workingDirectory: string # Start the script with this working directory.
            condition: | # Evaluate this condition expression to determine whether to run this task.
              and
              (
                succeeded(), 
                gt(length('${{trim(parameters.overrideChangedPackageNames)}}'), 0)
              )
            # continueOnError: boolean # Continue running even on failure?
            displayName: 'Override changed packages' # Human-readable name for the task.
            # target: string | target # Environment in which to run this task.
            # enabled: boolean # Run this task when the job runs?
            # env: # Variables to map into the process's environment.
            #   string: string # Name/value pairs
            # name: string # ID of the step.
            # timeoutInMinutes: string # Time to wait for this task to complete before the server kills it.
            # retryCountOnTaskFailure: string # Number of retries if the task fails.
          - powershell: | # Required as first property. Inline PowerShell script.
              Write-Host "##vso[task.setvariable variable=changedPackageNames;isOutput=true]$(changedPackageNamesList)"
            # errorActionPreference: string # Unless otherwise specified, the error action preference defaults to the value stop. See the following section for more information.
            # failOnStderr: string # Fail the task if output is sent to Stderr?
            # ignoreLASTEXITCODE: string # Check the final exit code of the script to determine whether the step succeeded?
            # workingDirectory: string # Start the script with this working directory.
            # condition: string # Evaluate this condition expression to determine whether to run this task.
            # continueOnError: boolean # Continue running even on failure?
            displayName: 'Output changed packages' # Human-readable name for the task.
            # target: string | target # Environment in which to run this task.
            # enabled: boolean # Run this task when the job runs?
            # env: # Variables to map into the process's environment.
            #   string: string # Name/value pairs
            name: ChangedPackages # ID of the step.
            # timeoutInMinutes: string # Time to wait for this task to complete before the server kills it.
            # retryCountOnTaskFailure: string # Number of retries if the task fails.            
          - task: PowerShell@2
            name: TestPackages
            displayName: 'Find test packages'
            inputs:
              #targetType: 'filePath' # 'filePath' | 'inline'. Type. Default: filePath.
              filePath: 'build/scripts/FindTestPackages.ps1' # string. Required when targetType = filePath. Script Path. 
              arguments: '-PackageInfos ''${{variables.packageInfos}}'' -TraceLevel ${{parameters.traceLevel}}' # string. Optional. Use when targetType = filePath. Arguments. 
              #script: # string. Required when targetType = inline. Script. 
            # Preference Variables
              #errorActionPreference: 'stop' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
              #warningPreference: 'default' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. WarningPreference. Default: default.
              informationPreference: 'continue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. InformationPreference. Default: default.
              verbosePreference: ${{ iif(eq(parameters.enableVerboseOutput, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. VerbosePreference. Default: default.
              debugPreference: ${{ iif(eq(parameters.enableDebug, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. DebugPreference. Default: default.
              #progressPreference: 'silentlyContinue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ProgressPreference. Default: silentlyContinue.
            # Advanced
              #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
              #showWarnings: false # boolean. Show warnings as Azure DevOps warnings. Default: false.
              #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
              pwsh: true # boolean. Use PowerShell Core. Default: false.
              #workingDirectory: # string. Working Directory. 
              #runScriptInSeparateScope: false # boolean. Run script in the separate scope. Default: false.              
      - job: Version_numbering
        displayName: 'Calculate version numbers' # Human-readable name for the job.
        dependsOn:  # Any jobs which must complete before this one.
          - Production_packages
        variables:
          changedPackageNames: $[ dependencies.Production_packages.outputs['ChangedPackages.changedPackageNames'] ]
          versionNumberList: ''
        pool:
          vmImage: windows-latest
        steps:
        # NuGet tool installer v1
        # Acquires a specific version of NuGet from the internet or the tools cache and adds it to the PATH. Use this task to change the version of NuGet used in the NuGet tasks.
        - task: NuGetToolInstaller@1
          # inputs:
          # Advanced
            #versionSpec: # string. Version of NuGet.exe to install. 
            # checkLatest: false # boolean. Always check for new versions. Default: false.
        # NuGet authenticate v1
        # Configure NuGet tools to authenticate with Azure Artifacts and other NuGet repositories. Requires NuGet >= 4.8.5385, dotnet >= 6, or MSBuild >= 15.8.166.59604.
        - task: NuGetAuthenticate@1
          # inputs:
          #   forceReinstallCredentialProvider: false # boolean. Reinstall the credential provider even if already installed. Default: false.
            #nuGetServiceConnections: # string. Service connection credentials for feeds outside this organization.            
        - ${{ each packageName in split(variables.allPackageNames, ',') }}:
          # Azure CLI v2
          # Run Azure CLI commands against an Azure subscription in a PowerShell Core/Shell script when running on Linux agent or PowerShell/PowerShell Core/Batch script when running on Windows agent.
          - task: AzureCLI@2
            displayName: "[${{ packageName }}] Declare required versions"
            inputs:
              azureSubscription: $(SUBSCRIPTION_ID) # string. Alias: connectedServiceNameARM. Required. Azure Resource Manager connection. 
              scriptType: 'pscore' # 'ps' | 'pscore' | 'batch' | 'bash'. Required. Script Type. 
              scriptLocation: 'scriptPath' # 'inlineScript' | 'scriptPath'. Required. Script Location. Default: scriptPath.
              scriptPath: 'build/scripts/DeclareRequiredVersionNumbers.ps1' # string. Required when scriptLocation = scriptPath. Script Path. 
              # inlineScript: # string. Required when scriptLocation = inlineScript. Inline Script. 
              arguments: '-PackageName ''${{ packageName }}'' -PackageInfos ''${{variables.packageInfos}}'' -TempPath ''$(Agent.TempDirectory)'' -OutputInformationPreference ''Continue'' -OutputVerbosePreference ${{iif(eq(parameters.enableVerboseOutput, ''true''), ''Continue'', ''SilentlyContinue'')}} -OutputDebugPreference ${{iif(eq(parameters.enableDebug, ''true''), ''Continue'', ''SilentlyContinue'')}} -TraceLevel ${{parameters.traceLevel}}' # string. Alias: scriptArguments. Script Arguments. 
              #powerShellErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. Optional. Use when scriptType = ps || scriptType = pscore. ErrorActionPreference. Default: stop.
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          # PowerShell v2
          # Run a PowerShell script on Linux, macOS, or Windows.
          - task: PowerShell@2
            condition: | # Evaluate this condition expression to determine whether to run this task.
              and
              (
                succeeded(), 
                or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0))), 
                or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{ packageName }}')), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), containsValue(split(variables['changedPackageNames'], ','), '${{ packageName }}')))
              )
            displayName: '[${{ packageName }}] Calculate optional versions' # Human-readable name for the task.
            inputs:
              #targetType: 'filePath' # 'filePath' | 'inline'. Type. Default: filePath.
              filePath: 'build/scripts/DeclareOptionalVersionNumbers.ps1' # string. Required when targetType = filePath. Script Path. 
              arguments: '-PackageName ''${{ packageName }}'' -SourceBranch ''$(Build.SourceBranch)'' -TraceLevel ${{parameters.traceLevel}}' # string. Optional. Use when targetType = filePath. Arguments. 
              #script: # string. Required when targetType = inline. Script. 
            # Preference Variables
              #errorActionPreference: 'stop' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
              #warningPreference: 'default' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. WarningPreference. Default: default.
              informationPreference: 'continue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. InformationPreference. Default: default.
              verbosePreference: ${{ iif(eq(parameters.enableVerboseOutput, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. VerbosePreference. Default: default.
              debugPreference: ${{ iif(eq(parameters.enableDebug, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. DebugPreference. Default: default.
              #progressPreference: 'silentlyContinue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ProgressPreference. Default: silentlyContinue.
            # Advanced
              #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
              #showWarnings: false # boolean. Show warnings as Azure DevOps warnings. Default: false.
              #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
              #pwsh: false # boolean. Use PowerShell Core. Default: false.
              #workingDirectory: # string. Working Directory. 
              #runScriptInSeparateScope: false # boolean. Run script in the separate scope. Default: false.            
        # PowerShell v2
        # Run a PowerShell script on Linux, macOS, or Windows.
        - task: PowerShell@2
          # condition: string # Evaluate this condition expression to determine whether to run this task.
          displayName: 'Output package versions list' # Human-readable name for the task.
          name: PromoteVersionList # ID of the step.
          inputs:
            #targetType: 'filePath' # 'filePath' | 'inline'. Type. Default: filePath.
            filePath: 'build/scripts/OutputVersionVars.ps1' # string. Required when targetType = filePath. Script Path. 
            arguments: '-TraceLevel ${{parameters.traceLevel}}' # string. Optional. Use when targetType = filePath. Arguments. 
            #script: # string. Required when targetType = inline. Script. 
          # Preference Variables
            #errorActionPreference: 'stop' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
            #warningPreference: 'default' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. WarningPreference. Default: default.
            informationPreference: 'continue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. InformationPreference. Default: default.
            verbosePreference: ${{ iif(eq(parameters.enableVerboseOutput, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. VerbosePreference. Default: default.
            debugPreference: ${{ iif(eq(parameters.enableDebug, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. DebugPreference. Default: default.
            #progressPreference: 'silentlyContinue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ProgressPreference. Default: silentlyContinue.
          # Advanced
            #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
            #showWarnings: false # boolean. Show warnings as Azure DevOps warnings. Default: false.
            #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
            pwsh: true # boolean. Use PowerShell Core. Default: false.
            #workingDirectory: # string. Working Directory. 
            #runScriptInSeparateScope: false # boolean. Run script in the separate scope. Default: false.          
      # Update the "next version numbers" stored in the pipeline for each changed package, in effect reserving those new numbers for the current pipeline run.
      - job: Version_reservation # Required as first property. ID of the job.
        displayName: 'Reserve production version numbers' # Human-readable name for the job.
        dependsOn:  # Any jobs which must complete before this one.
          - Production_packages
          - Version_numbering
        condition: | # Evaluate this condition expression to determine whether to run this job.
          and
          (
            succeeded(), 
            or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)))
          )                
        # continueOnError: string # Continue running even on failure?
        # timeoutInMinutes: string # Time to wait for this job to complete before the server kills it.
        # cancelTimeoutInMinutes: string # Time to wait for the job to cancel before forcibly terminating it.
        variables:  # Job-specific variables.
          changedPackageNames: $[ dependencies.Production_packages.outputs['ChangedPackages.changedPackageNames'] ]
          versionNumbers: $[ dependencies.Version_numbering.outputs['PromoteVersionList.versionNumberList'] ]
        steps:  # A list of steps to run.
        - ${{ each packageName in split(variables.allPackageNames, ',') }}:
          # Azure CLI v2
          # Run Azure CLI commands against an Azure subscription in a PowerShell Core/Shell script when running on Linux agent or PowerShell/PowerShell Core/Batch script when running on Windows agent.
          - task: AzureCLI@2
            displayName: '[${{ packageName }}] Reserve production versions' # Human-readable name for the task.
            condition: |
              and
              (
                succeeded(), 
                or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{ packageName }}')), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), containsValue(split(variables['changedPackageNames'], ','), '${{ packageName }}')))
              )
            inputs:
              azureSubscription: $(SUBSCRIPTION_ID) # string. Alias: connectedServiceNameARM. Required. Azure Resource Manager connection. 
              scriptType: 'pscore' # 'ps' | 'pscore' | 'batch' | 'bash'. Required. Script Type. 
              scriptLocation: 'scriptPath' # 'inlineScript' | 'scriptPath'. Required. Script Location. Default: scriptPath.
              scriptPath: 'build/scripts/UpdatePipelineVersionNumber.ps1' # string. Required when scriptLocation = scriptPath. Script Path. 
              #inlineScript: # string. Required when scriptLocation = inlineScript. Inline Script. 
              arguments: '-PackageName ''${{ packageName }}'' -VersionNumberName PackagePostProductionVersion -VariableNamePrefix next -TraceLevel ${{parameters.traceLevel}}' # string. Alias: scriptArguments. Script Arguments. 
              #powerShellErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. Optional. Use when scriptType = ps || scriptType = pscore. ErrorActionPreference. Default: stop.
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
  - stage: Build
    dependsOn: Configure
    variables:
      changedPackageNames: $[stageDependencies.Configure.Production_packages.outputs['ChangedPackages.changedPackageNames']]
      versionNumbers: $[stageDependencies.Configure.Version_numbering.outputs['PromoteVersionList.versionNumberList']]
      hasAssemblyVersionNumbers: $[stageDependencies.Configure.Version_numbering.outputs['PromoteVersionList.hasAssemblyVersionPackageNames']]
      hasAssemblyFileVersionNumbers: $[stageDependencies.Configure.Version_numbering.outputs['PromoteVersionList.hasAssemblyFileVersionPackageNames']]
      hasAssemblyInformationalVersionNumbers: $[stageDependencies.Configure.Version_numbering.outputs['PromoteVersionList.hasAssemblyInformationalVersionPackageNames']]
    jobs:
    - ${{ each packageName in split(variables.allPackageNames, ',') }}:
      - job: 
        displayName: 'Build package ${{packageName}}'
        condition: |
          and
          (
            succeeded(), 
            or(containsValue(split(variables.buildRequiredPackageNames, ','), '${{packageName}}'), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{packageName}}'), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), containsValue(split(variables['changedPackageNames'], ','), '${{packageName}}')))
          )        
        pool:
          vmImage: windows-latest
        strategy:
          matrix:
            ${{ if eq(parameters.buildAnyCPU, 'true') }}:
              Debug_AnyCPU:
                BuildConfiguration: debug
                BuildPlatform: "Any CPU"
              Release_AnyCPU:
                BuildConfiguration: release
                BuildPlatform: "Any CPU"
            ${{ if eq(parameters.buildX86, 'true') }}:
              Debug_x86:
                BuildConfiguration: debug
                BuildPlatform: x86
              Release_x86:
                BuildConfiguration: release
                BuildPlatform: x86
            ${{ if eq(parameters.buildX64, 'true') }}:
              Debug_x64:
                BuildConfiguration: debug
                BuildPlatform: x64
              Release_x64:
                BuildConfiguration: release
                BuildPlatform: x64
        variables:
          buildSolution: '${{packageName}}.slnf'
          isContinuousIntegrationBuild: true
        steps:
        - template: /build/build-steps.yml  # reference to template
          parameters: # provided parameters
            packageName: ${{packageName}}
            buildSolution: ${{variables.buildSolution}}
            buildAssemblyVersionPackageNames: $(hasAssemblyVersionNumbers)
            buildAssemblyFileVersionPackageNames: $(hasAssemblyFileVersionNumbers)
            buildAssemblyInformationalVersionPackageNames: $(hasAssemblyInformationalVersionNumbers)
            packageNames: ${{variables.allPackageNames}}
            packageInfos: ${{variables.packageInfos}}
            encodedPackageVersions: $(versionNumbers)
            buildConfiguration: $(BuildConfiguration)
            buildPlatform: $(BuildPlatform)
            isContinuousIntegration: ${{variables.isContinuousIntegrationBuild}}
            enableVerboseOutput: ${{parameters.enableVerboseOutput}}
            enableDebug: ${{parameters.enableDebug}}
            traceLevel: ${{parameters.traceLevel}}
  - stage: QA
    dependsOn: 
      - Configure
      - Build
    variables:
      changedPackageNames: $[stageDependencies.Configure.Production_packages.outputs['ChangedPackages.changedPackageNames']]
      testPackageNames: $[stageDependencies.Configure.Production_packages.outputs['TestPackages.testPackageNames']]
    jobs:
    - ${{ each packageName in split(variables.allPackageNames, ',') }}:
      - job:  # Required as first property. ID of the job.
        displayName: 'Test package ${{packageName}}' # Human-readable name for the job.
        # dependsOn: string | [ string ] # Any jobs which must complete before this one.
        condition: | # Evaluate this condition expression to determine whether to run this job.
          and
          (
            succeeded(), 
            containsValue(split(coalesce(variables['testPackageNames'], ''), ','), '${{packageName}}'), 
            or(containsValue(split(variables.buildRequiredPackageNames, ','), '${{packageName}}'), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{packageName}}'), containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{packageName}}'))
          )
        # continueOnError: string # Continue running even on failure?
        # timeoutInMinutes: 480 # Time to wait for this job to complete before the server kills it.
        # cancelTimeoutInMinutes: string # Time to wait for the job to cancel before forcibly terminating it.
        variables:
          testAssemblies: |
            tests/**/bin/${{ variables.TestPlatformPath }}/$(BuildConfiguration)/**/${{packageName}}.*Test.dll
            tests/**/bin/${{ variables.TestPlatformPath }}/$(BuildConfiguration)/**/${{packageName}}.*Tests.dll
            tests/**/bin/${{ variables.TestPlatformPath }}/$(BuildConfiguration)/**/${{packageName}}.*Test.*.dll
            tests/**/bin/${{ variables.TestPlatformPath }}/$(BuildConfiguration)/**/${{packageName}}.*Tests.*.dll
            !**/*TestAdapter.dll
            !**/obj/**
            !**/ref/**
        strategy: # Execution strategy for this job.
          matrix:
            ${{ if eq(parameters.buildAnyCPU, 'true') }}:
              Debug_AnyCPU:
                BuildConfiguration: debug
                BuildPlatform: "Any CPU"
                TestPlatformPath: '**'  # No platform subfolder for Any CPU
              Release_AnyCPU:
                BuildConfiguration: release
                BuildPlatform: "Any CPU"
                TestPlatformPath: '**'  # No platform subfolder for Any CPU
            ${{ if eq(parameters.buildX86, 'true') }}:
              Debug_x86:
                BuildConfiguration: debug
                BuildPlatform: x86
                TestPlatformPath: 'x86'
              Release_x86:
                BuildConfiguration: release
                BuildPlatform: x86
                TestPlatformPath: 'x86'
            ${{ if eq(parameters.buildX64, 'true') }}:
              Debug_x64:
                BuildConfiguration: debug
                BuildPlatform: x64
                TestPlatformPath: 'x64'
              Release_x64:
                BuildConfiguration: release
                BuildPlatform: x64
                TestPlatformPath: 'x64'
        pool: 
          vmImage: windows-latest # Pool where this job will run.
        steps: # A list of steps to run.
        - template: /build/qa-steps.yml  # reference to template
          parameters: # provided parameters
            packageName: ${{packageName}}
            testAssemblySearchPattern: ${{ variables.testAssemblies }}
            buildPlatform: $(BuildPlatform)
            buildConfiguration: $(BuildConfiguration)
  - stage: Publication
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['isDevelopBranch'], 'true'),
          and(
            gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0),
            gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)
          )
        ),
        or(
          and(
            gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0),
            gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)
          ),
          and(
            gt(length(coalesce(stageDependencies.Configure.outputs['Production_packages.ChangedPackages.changedPackageNames'], '')), 0),
            gt(length(split(stageDependencies.Configure.outputs['Production_packages.ChangedPackages.changedPackageNames'], ',')), 0)
          )
        )
      )
    dependsOn:
      - Configure
      - Build
      - QA
    variables:
      changedPackageNames: $[stageDependencies.Configure.Production_packages.outputs['ChangedPackages.changedPackageNames']]
      versionNumbers: $[stageDependencies.Configure.Version_numbering.outputs['PromoteVersionList.versionNumberList']]
    jobs:
      - job: Create_Packages
        displayName: "Create NuGet packages"
        pool:
          vmImage: windows-latest
        strategy:
          matrix:
            Debug:
              BuildConfiguration: debug
            Release:
              BuildConfiguration: release
        steps:
          - template: /build/publication-create-packages-prepare.yml  # reference to template
            parameters: # provided parameters
              buildConfiguration: $(BuildConfiguration)
              buildSolution: ${{variables.solution}}
          # Create NuGet packages
          - ${{ each packageName in split(variables.allPackageNames, ',') }}:
              - task: PowerShell@2
                displayName: '[${{packageName}}] Set release notes argument'
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(coalesce(variables.publicationRequiredPackageNames, ''), ','), '${{ packageName }}'), and(containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{ packageName }}'), eq(variables['isDevelopBranch'], 'true')))
                  )                
                inputs:
                  #targetType: 'filePath' # 'filePath' | 'inline'. Type. Default: filePath.
                  filePath: 'build/scripts/SetReleaseNotesArgument.ps1' # string. Required when targetType = filePath. Script Path. 
                  arguments: '-PackageName ${{packageName}} -SourceCommitHash $(Build.SourceVersion) -PackageInfos ''${{variables.packageInfos}}'' -SourceRootFolderPath $(Build.SourcesDirectory) -IsBuildMasterBranch ${{ iif(eq(variables[''Build.SourceBranch''], ''refs/heads/master''), ''$True'', ''$False'') }} -TraceLevel ${{parameters.traceLevel}}' # string. Optional. Use when targetType = filePath. Arguments. 
                  #script: # string. Required when targetType = inline. Script. 
                # Preference Variables
                  #errorActionPreference: 'stop' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
                  #warningPreference: 'default' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. WarningPreference. Default: default.
                  informationPreference: 'continue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. InformationPreference. Default: default.
                  verbosePreference: ${{ iif(eq(parameters.enableVerboseOutput, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. VerbosePreference. Default: default.
                  debugPreference: ${{ iif(eq(parameters.enableDebug, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. DebugPreference. Default: default.
                  #progressPreference: 'silentlyContinue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ProgressPreference. Default: silentlyContinue.
                # Advanced
                  #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
                  #showWarnings: false # boolean. Show warnings as Azure DevOps warnings. Default: false.
                  #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
                  pwsh: true # boolean. Use PowerShell Core. Default: false.
                  #workingDirectory: # string. Working Directory. 
                  #runScriptInSeparateScope: false # boolean. Run script in the separate scope. Default: false.
              - pwsh: |
                  if (${{parameters.traceLevel}} -gt 0) {
                      Set-PSDebug -Trace ${{parameters.traceLevel}}
                  }

                  $packageInfo = '${{ variables.packageInfos }}' | ConvertFrom-Json | Where-Object -Property packageName -EQ '${{packageName}}'
                  if ($null -eq $packageInfo) {
                      Write-Error 'Package information not found for ${{packageName}}'
                  }

                  # Compose project search pattern.
                  $projectSearchPattern = "$(Build.SourcesDirectory)/$($packageInfo.packageSourcePath)/**/*.csproj"
                  Write-Host "##vso[task.setvariable variable=searchPatternArg]$projectSearchPattern"
                displayName: '[${{packageName}}] Set search pattern argument'
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(coalesce(variables.publicationRequiredPackageNames, ''), ','), '${{ packageName }}'), and(containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{ packageName }}'), eq(variables['isDevelopBranch'], 'true')))
                  )
              - pwsh: |
                  Import-Module "$(Build.SourcesDirectory)/build/psmodules/CommonHelpers/CommonHelpers.psm1" -Force

                  if (${{parameters.traceLevel}} -gt 0) {
                      Set-PSDebug -Trace ${{parameters.traceLevel}}
                  }

                  $packageVersions = '$(versionNumbers)' | 
                  ConvertFrom-Base64String | 
                  ConvertFrom-Json | 
                  Where-Object -Property PackageName -EQ -Value '${{packageName}}'
                  Write-Host "##vso[task.setvariable variable=packageVersionArg]$($packageVersions.PackageProductionVersionString)"
                displayName: "[${{packageName}}] Set package version argument"
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(coalesce(variables.publicationRequiredPackageNames, ''), ','), '${{ packageName }}'), and(containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{ packageName }}'), eq(variables['isDevelopBranch'], 'true')))
                  )
              # .NET Core v2
              # Build, test, package, or publish a .NET application, or run a custom .NET CLI command.
              - task: DotNetCoreCLI@2
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(coalesce(variables.publicationRequiredPackageNames, ''), ','), '${{ packageName }}'), and(containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{ packageName }}'), eq(variables['isDevelopBranch'], 'true')))
                  )
                displayName: "[${{packageName}}] Create NuGet package"
                inputs:
                  #azureSubscription: # string. Alias: ConnectedServiceName. Azure Resource Manager connection. 
                  command: 'pack' # 'build' | 'push' | 'pack' | 'publish' | 'restore' | 'run' | 'test' | 'custom'. Required. Command. Default: build.
                  #publishWebProjects: true # boolean. Optional. Use when command = publish. Publish web projects. Default: true.
                  #projects: # string. Optional. Use when command = build || command = restore || command = run || command = test || command = custom || publishWebProjects = false. Path to project(s) or solution(s). 
                  #custom: # string. Required when command = custom. Custom command. 
                  #arguments: # string. Optional. Use when command = build || command = publish || command = run || command = test || command = custom. Arguments. 
                  packagesToPack: '$(searchPatternArg)' # string. Alias: searchPatternPack. Required when command = pack. Path to csproj or nuspec file(s) to pack. Default: **/*.csproj.
                  #configuration: '$(BuildConfiguration)' # string. Alias: configurationToPack. Optional. Use when command = pack. Configuration to Package. Default: $(BuildConfiguration).
                  packDirectory: "$(Build.ArtifactStagingDirectory)/packages/$(BuildConfiguration)" # string. Alias: outputDir. Optional. Use when command = pack. Package Folder. Default: $(Build.ArtifactStagingDirectory).
                  nobuild: true # boolean. Optional. Use when command = pack. Do not build. Default: false.
                  #includesymbols: false # boolean. Optional. Use when command = pack. Include Symbols. Default: false.
                  #includesource: false # boolean. Optional. Use when command = pack. Include Source. Default: false.
                  #requestTimeout: '300000' # string. Set timeout for package download request. Default: 300000.
                # Advanced
                  buildProperties: 'PackageVersion="$(packageVersionArg)"' # string. Optional. Use when command = pack. Additional build properties. 
                  #verbosityPack: 'Normal' # '-' | 'Quiet' | 'Minimal' | 'Normal' | 'Detailed' | 'Diagnostic'. Optional. Use when command = pack. Verbosity. Default: Normal.
                # Advanced
                  #workingDirectory: # string. Optional. Use when command != restore && command != push && command != pack. Working directory.                  
              - task: PowerShell@2
                displayName: '[${{packageName}}] Update package metadata'
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(coalesce(variables.publicationRequiredPackageNames, ''), ','), '${{ packageName }}'), and(containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{ packageName }}'), eq(variables['isDevelopBranch'], 'true')))
                  )
                inputs:
                  #targetType: 'filePath' # 'filePath' | 'inline'. Type. Default: filePath.
                  filePath: 'build/scripts/UpdatePackageMetadata.ps1' # string. Required when targetType = filePath. Script Path. 
                  arguments: "-PackageName '${{packageName}}' -EncodedPackageVersions '$(versionNumbers)' -EncodedReleaseNotes '$(releaseNotesArg)' -PackageSearchRootPath '$(Build.ArtifactStagingDirectory)' -BuildConfiguration $(BuildConfiguration) -TempPath '$(Agent.TempDirectory)' -TraceLevel ${{parameters.traceLevel}}" # string. Optional. Use when targetType = filePath. Arguments. 
                  #script: # string. Required when targetType = inline. Script. 
                # Preference Variables
                  #errorActionPreference: 'stop' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ErrorActionPreference. Default: stop.
                  #warningPreference: 'default' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. WarningPreference. Default: default.
                  informationPreference: 'continue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. InformationPreference. Default: default.
                  verbosePreference: ${{ iif(eq(parameters.enableVerboseOutput, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. VerbosePreference. Default: default.
                  debugPreference: ${{ iif(eq(parameters.enableDebug, 'true'), 'continue', 'default') }} # 'default' | 'stop' | 'continue' | 'silentlyContinue'. DebugPreference. Default: default.
                  #progressPreference: 'silentlyContinue' # 'default' | 'stop' | 'continue' | 'silentlyContinue'. ProgressPreference. Default: silentlyContinue.
                # Advanced
                  #failOnStderr: false # boolean. Fail on Standard Error. Default: false.
                  showWarnings: true # boolean. Show warnings as Azure DevOps warnings. Default: false.
                  #ignoreLASTEXITCODE: false # boolean. Ignore $LASTEXITCODE. Default: false.
                  pwsh: true # boolean. Use PowerShell Core. Default: false.
                  #workingDirectory: # string. Working Directory. 
                  #runScriptInSeparateScope: false # boolean. Run script in the separate scope. Default: false.                  
          # Publish NuGet packages to pipeline
          - task: PublishBuildArtifacts@1
            condition: |
              and
              (
                succeeded(), 
                or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), gt(length(split(variables['changedPackageNames'], ',')), 0)))
              )            
            inputs:
              PathtoPublish: $(Build.ArtifactStagingDirectory)/packages # Required  # The folder or file path to publish. This can be a fully-qualified path or a path relative to the root of the repository. Wildcards are not supported. [Variables](https://go.microsoft.com/fwlink/?LinkID=550988) are supported. Example: $(Build.ArtifactStagingDirectory)
              ArtifactName: packages # Required  # The name of the artifact to create in the publish location.
              ArtifactType: Container # Options: 'Container', 'FilePath' # Required  # Choose whether to store the artifact in Azure Pipelines, or to copy it to a file share that must be accessible from the build agent.
              # TargetPath:   # Required when ArtifactType = FilePath  # The file share to which the artifact files will be copied. This can include variables. Example: ////////my////share////$(Build.DefinitionName)////$(Build.BuildNumber). Publishing artifacts from a Linux or macOS agent to a file share is not supported.
              #Parallel:  # Optional  # Select whether to copy files in parallel using multiple threads for greater potential throughput. If this setting is not enabled, one thread will be used.
              #ParallelCount:  # Optional  # Enter the degree of parallelism, or number of threads used, to perform the copy. The value must be at least 1 and not greater than 128.
              #FileCopyOptions:  # Optional  # Pass additional options to the Robocopy command.
              #StoreAsTar:  # Optional  # Add all files from the publish path to a tar archive before uploading. This allows you to preserve the UNIX file permissions. Use `extractTars` option of DownloadBuildArtifacts task to extract the downloaded items automatically.
      - template: /build/publication-publish-packages-job.yml  # reference to template
        parameters: # provided parameters
          publicationRequiredPackageNames: ${{variables.publicationRequiredPackageNames}}
          changedPackageNames: $(changedPackageNames)
          buildConfiguration: $(BuildConfiguration)
  - stage: Cleanup
    displayName: "End"
    dependsOn:
      - Configure
      - Build
      - QA
      - Publication
    condition: succeededOrFailed()
    variables:
      changedPackageNames: $[stageDependencies.Configure.Production_packages.outputs['ChangedPackages.changedPackageNames']]
      versionNumbers: $[stageDependencies.Configure.Version_numbering.outputs['PromoteVersionList.versionNumberList']]
    jobs:
      - job: Version_rollback # Required as first property. ID of the job.
        displayName: 'Rollback version numbers on failure' # Human-readable name for the job.
        # dependsOn: string | [ string ] # Any jobs which must complete before this one.
        condition: | # Evaluate this condition expression to determine whether to run this job.
          and
          (
            in(stageDependencies.Configure.Version_reservation.result, 'Succeeded'),
            notIn(stageDependencies.Publication.Publish_Packages.result, 'Succeeded', 'SucceededWithIssues'),
            or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0))), 
            or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), gt(length(split(variables['changedPackageNames'], ',')), 0)))
          )
        # continueOnError: string # Continue running even on failure?
        # timeoutInMinutes: string # Time to wait for this job to complete before the server kills it.
        # cancelTimeoutInMinutes: string # Time to wait for the job to cancel before forcibly terminating it.
        # variables:  # Job-specific variables.
        steps: # A list of steps to run.
        - ${{ each packageName in split(variables.allPackageNames, ',') }}:
          # Azure CLI v2
          # Run Azure CLI commands against an Azure subscription in a PowerShell Core/Shell script when running on Linux agent or PowerShell/PowerShell Core/Batch script when running on Windows agent.
          - task: AzureCLI@2
            condition: | # Evaluate this condition expression to determine whether to run this task.
              and
              (
                succeeded(), 
                or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0))), 
                or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{ packageName }}')), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), containsValue(split(variables['changedPackageNames'], ','), '${{ packageName }}')))
              )
            displayName: '[${{packageName}}] Prepare arguments for rollback' # Human-readable name for the task.
            inputs:
              azureSubscription: $(SUBSCRIPTION_ID) # string. Alias: connectedServiceNameARM. Required. Azure Resource Manager connection. 
              scriptType: 'pscore' # 'ps' | 'pscore' | 'batch' | 'bash'. Required. Script Type. 
              scriptLocation: 'inlineScript' # 'inlineScript' | 'scriptPath'. Required. Script Location. Default: scriptPath.
              # scriptPath: # string. Required when scriptLocation = scriptPath. Script Path. 
              inlineScript: | # string. Required when scriptLocation = inlineScript. Inline Script. 
                Import-Module "$(Build.SourcesDirectory)/build/psmodules/CommonHelpers/CommonHelpers.psm1" -Force

                if (${{parameters.traceLevel}} -gt 0) {
                    Set-PSDebug -Trace ${{parameters.traceLevel}}
                }

                # set environment variable for current process
                $env:AZURE_DEVOPS_EXT_PAT = $env:SYSTEM_ACCESSTOKEN
                                                          
                az devops configure -d organization=${env:ORGANIZATION_URL} project=${env:PROJECT_NAME}
                az account set -s ${env:SUBSCRIPTION_ID}

                $packageVersions = '$(versionNumbers)' | ConvertFrom-Base64String | ConvertFrom-Json | Where-Object -Property PackageName -EQ ${{ packageName }}
                if ($null -eq $packageVersions) {
                    Write-Error 'Package versions not found for ${{ packageName }}'
                }
                
                [version]$originalNextPackageVersion = $packageVersions.PackagePostProductionVersion
                Write-Host "##vso[task.setvariable variable=originalNextMajor]$($originalNextPackageVersion.Major)"
                Write-Host "##vso[task.setvariable variable=originalNextMinor]$($originalNextPackageVersion.Minor)"
                Write-Host "##vso[task.setvariable variable=originalNextPatch]$($originalNextPackageVersion.Build)"
                Write-Host "##vso[task.setvariable variable=originalNextPreview]$($originalNextPackageVersion.Revision)"

                $packageInfo = '${{variables.packageInfos}}' | ConvertFrom-Json | Where-Object -Property packageName -EQ '${{packageName}}'
                if ($null -eq $packageInfo) {
                    Write-Error 'Package information not found for ${{packageName}}'
                }

                $variableListOutput = & az pipelines variable-group variable list --group-id $packageInfo.variableGroupId
                $variableGroupVersionNumbers = ($variableListOutput | ConvertFrom-Json).PSObject.Properties 
                | Where-Object { $_.Name.StartsWith('next') } 
                | Out-String -InputObject { $_.Name + ':' + $_.Value.value } -Stream 
                | Sort-Object 
                | ConvertFrom-Csv -Delimiter ':' -Header 'Name', 'Value' 
                | Out-String -InputObject { $_.Value } -Stream
                [version] $currentNextPackageVersion = ($variableGroupVersionNumbers[0], $variableGroupVersionNumbers[1], $variableGroupVersionNumbers[2], $variableGroupVersionNumbers[3] -join '.')
                Write-Host "##vso[task.setvariable variable=currentNextMajor]$($currentNextPackageVersion.Major)"
                Write-Host "##vso[task.setvariable variable=currentNextMinor]$($currentNextPackageVersion.Minor)"
                Write-Host "##vso[task.setvariable variable=currentNextPatch]$($currentNextPackageVersion.Build)"
                Write-Host "##vso[task.setvariable variable=currentNextPreview]$($currentNextPackageVersion.Revision)"
              #arguments: # string. Alias: scriptArguments. Script Arguments. 
              #powerShellErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. Optional. Use when scriptType = ps || scriptType = pscore. ErrorActionPreference. Default: stop.
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          # Azure CLI v2
          # Run Azure CLI commands against an Azure subscription in a PowerShell Core/Shell script when running on Linux agent or PowerShell/PowerShell Core/Batch script when running on Windows agent.
          - task: AzureCLI@2
            condition: | # Evaluate this condition expression to determine whether to run this task.
              and
              (
                succeeded(), 
                or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0))), 
                or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{ packageName }}')), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), containsValue(split(variables['changedPackageNames'], ','), '${{ packageName }}'))),
                and(eq(variables['currentNextMajor'], variables['originalNextMajor']), eq(variables['currentNextMinor'], variables['originalNextMinor']), eq(variables['currentNextPatch'], variables['originalNextPatch']), eq(variables['currentNextPreview'], variables['originalNextPreview']))
              )
            displayName: '[${{packageName}}] Rollback version numbers' # Human-readable name for the task.
            inputs:
              azureSubscription: $(SUBSCRIPTION_ID) # string. Alias: connectedServiceNameARM. Required. Azure Resource Manager connection. 
              scriptType: 'pscore' # 'ps' | 'pscore' | 'batch' | 'bash'. Required. Script Type. 
              # scriptLocation: 'scriptPath' # 'inlineScript' | 'scriptPath'. Required. Script Location. Default: scriptPath.
              scriptPath: 'build/scripts/UpdatePipelineVersionNumber.ps1' # string. Required when scriptLocation = scriptPath. Script Path. 
              # inlineScript: string # string. Required when scriptLocation = inlineScript. Inline Script. 
              arguments: '-PackageName ''${{packageName}}'' -VersionNumberName PackageNextVersion -VariableNamePrefix next -TraceLevel ${{parameters.traceLevel}}' # string. Alias: scriptArguments. Script Arguments. 
              #powerShellErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. Optional. Use when scriptType = ps || scriptType = pscore. ErrorActionPreference. Default: stop.
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - task: AzureCLI@2
            displayName: '[${{packageName}}] Confirm rollback'
            condition: |
              and
              (
                succeeded(), 
                or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0))), 
                or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), containsValue(split(variables.publicationRequiredPackageNames, ','), '${{ packageName }}')), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), containsValue(split(variables['changedPackageNames'], ','), '${{ packageName }}'))),
                and(eq(variables['currentNextMajor'], variables['originalNextMajor']), eq(variables['currentNextMinor'], variables['originalNextMinor']), eq(variables['currentNextPatch'], variables['originalNextPatch']), eq(variables['currentNextPreview'], variables['originalNextPreview']))
              )                
            inputs:
              azureSubscription: $(SUBSCRIPTION_ID) # string. Alias: connectedServiceNameARM. Required. Azure Resource Manager connection. 
              scriptType: 'pscore' # 'ps' | 'pscore' | 'batch' | 'bash'. Required. Script Type. 
              # scriptLocation: 'scriptPath' # 'inlineScript' | 'scriptPath'. Required. Script Location. Default: scriptPath.
              scriptPath: 'build/scripts/ConfirmVersionNumberRollback.ps1' # string. Required when scriptLocation = scriptPath. Script Path. 
              # inlineScript: string # string. Required when scriptLocation = inlineScript. Inline Script. 
              arguments: '-PackageName ''${{packageName}}'' -PackageInfos ''${{variables.packageInfos}}'' -EncodedPackageVersions ''$(versionNumbers)'' -TraceLevel ${{parameters.traceLevel}}' # string. Alias: scriptArguments. Script Arguments. 
              #powerShellErrorActionPreference: 'stop' # 'stop' | 'continue' | 'silentlyContinue'. Optional. Use when scriptType = ps || scriptType = pscore. ErrorActionPreference. Default: stop.
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      - job: Tag
        displayName: "Tag repo with version for changed packages"
        condition: |
          and
          (
            in(stageDependencies.Publication.Publish_Packages.result, 'Succeeded'), 
            or(eq(variables['isDevelopBranch'], 'true'), eq('${{parameters.forceTagging}}', 'true')), 
            or(and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)), and(gt(length(coalesce(variables['changedPackageNames'], '')), 0), gt(length(split(variables['changedPackageNames'], ',')), 0)))
          )        
        steps:
          - checkout: self
            persistCredentials: true
          - template: /build/configure-git-user.yml
          - ${{ each packageName in split(variables.allPackageNames, ',') }}:
              - pwsh: |
                  Import-Module "$(Build.SourcesDirectory)/build/psmodules/CommonHelpers/CommonHelpers.psm1" -Force

                  if (${{parameters.traceLevel}} -gt 0) {
                      Set-PSDebug -Trace ${{parameters.traceLevel}}
                  }

                  $packageVersions = "$(versionNumbers)" | ConvertFrom-Base64String | ConvertFrom-Json | Where-Object -Property PackageName -EQ -Value ${{packageName}}
                  if ($null -eq $packageVersions) {
                      Write-Error 'Package versions not found for ${{packageName}}'
                  }

                  [version]$productionPackageVersion = $packageVersions.PackageProductionVersion
                  $message = "CI preview build $productionPackageVersion for package ${{packageName}}"

                  $tagName = "v$productionPackageVersion-${{packageName}}"
                  $commitHash = "$(Build.SourceVersion)"
                  git tag -m $message $tagName $commitHash
                  git push origin $tagName
                # failOnStderr: true
                displayName: "[${{ packageName }}] Apply package version tag"
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(coalesce(variables.publicationRequiredPackageNames, ''), ','), '${{ packageName }}'), containsValue(split(coalesce(variables['changedPackageNames'], ''), ','), '${{ packageName }}'))
                  )                
                env:
                  GIT_REDIRECT_STDERR: "2>&1"
      - job: Update_package_version
        displayName: "Update package current version numbers"
        condition: |
          and
          (
            in(stageDependencies.Publication.Publish_Packages.result, 'Succeeded'), 
            or(eq(variables['isDevelopBranch'], 'true'), and(gt(length(coalesce(variables.publicationRequiredPackageNames, '')), 0), gt(length(split(variables.publicationRequiredPackageNames, ',')), 0)))
          )        
        steps:
          - ${{ each packageName in split(variables.allPackageNames, ',') }}:
              - task: AzureCLI@2
                displayName: "[${{packageName}}] Update current version numbers"
                condition: |
                  and
                  (
                    succeeded(), 
                    or(containsValue(split(variables.publicationRequiredPackageNames, ','), '${{packageName}}'), containsValue(split(variables['changedPackageNames'], ','), '${{packageName}}'))
                  )                
                inputs:
                  azureSubscription: $(SUBSCRIPTION_ID) # string. Alias: connectedServiceNameARM. Required. Azure Resource Manager connection.
                  scriptType: "pscore" # 'ps' | 'pscore' | 'batch' | 'bash'. Required. Script Type.
                  # scriptLocation: "scriptPath" # 'inlineScript' | 'scriptPath'. Required. Script Location. Default: scriptPath.
                  scriptPath: 'build/scripts/UpdatePipelineVersionNumber.ps1' # string. Required when scriptLocation = scriptPath. Script Path.
