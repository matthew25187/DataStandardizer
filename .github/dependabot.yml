# Version updates for NuGet packages, GitHub Actions and the .NET SDK.  See "Dependabot" in AGENTS.md.
#
# There's no target-branch: pull requests go to the default branch, develop.  Setting it would stop the options below
# applying to security updates, so a security update could move an ignored pin.

version: 2

updates:
  - package-ecosystem: nuget
    # DataStandardizer.sln lists every project, and through them Dependabot reaches all four Directory.Packages.props
    # files.  It doesn't search subfolders, so tests/, benchmarks/ and fuzz/ can't be listed: none holds a solution or
    # project.
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Intentional exact pins.  The [4.5.5] pin of System.Memory needs no entry here: it's a conditional
      # <PackageVersion Update=...>, and Dependabot only changes <PackageVersion Include=...>, which stays free to move.
      - dependency-name: System.ValueTuple
      - dependency-name: FluentAssertions
      # Has to stay on the same version as the SharpFuzz.CommandLine tool, which Dependabot can't reach from here: it
      # looks for .config/dotnet-tools.json only in this directory and its parents, not in fuzz/.  Bump both by hand,
      # together.
      - dependency-name: SharpFuzz
    groups:
      # The packages in tests/Directory.Packages.props and benchmarks/Directory.Packages.props, which never version a
      # package.  A package added to either file gets its own pull requests until it's listed here.
      test-and-benchmark:
        patterns:
          - BenchmarkDotNet
          - coverlet.collector
          - CsvHelper
          - FolkerKinzel.VCards
          - Ical.Net
          - Microsoft.NET.Test.Sdk
          - MimeKit
          - xunit
          - xunit.runner.visualstudio
        update-types:
          - minor
          - patch

  # Updates the SHA pins and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every github/codeql-action step in a workflow has to run the same version, so they move together.
      codeql-action:
        patterns:
          - github/codeql-action/*

  # Changes only the version in global.json, so rollForward stays at disable.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
